groups:
- id: speech-llm-end-to-end
  title: 端到端 Audio LLM / Speech-LLM (直接对标)
  description: 与本报告 4.3B Qwen3-Audio-style 模型最直接可比；作为 baseline 或 architecture reference。
- id: classic-asr-baseline
  title: 经典 ASR baseline / encoder (必引)
  description: Whisper / Conformer / Paraformer 等强 baseline；几乎所有 audio LLM 的 encoder 都源自此组工作。
- id: ssl-speech-encoder
  title: SSL Speech Encoder
  description: HuBERT / WavLM / BEATs 等自监督 speech encoder。
- id: llm-based-asr
  title: LLM-based ASR 范式 (adapter / prompt / 端到端)
  description: 直接将语音特征接入 LLM 的方法学先驱。
- id: contextual-biasing
  title: 热词 / Contextual Biasing (本报告重点章节)
  description: 上下文偏置 / 热词召回相关工作。
- id: target-speaker-asr
  title: Target-Speaker ASR (本报告重点章节)
  description: 目标说话人 ASR / 说话人条件解码。
- id: benchmark
  title: Benchmark / 评测协议
  description: 公开 benchmark 与挑战赛协议。
- id: closed-source
  title: 闭源 / 商用系统
  description: 商用系统的可下载 PDF（多数在 commercial-systems.md 仅列链接）。
