# refs/datasets/INDEX.yaml
#
# Single source of truth for dataset paper / datasheet PDFs.
# PDFs are gitignored; download via:
#
#     uv run tools/fetch-refs.py egs/amphion-asr-2026
#
# (uv reads the PEP 723 inline metadata block in tools/fetch-refs.py.)
#
# Schema and conventions: same as refs/notes/papers/INDEX.yaml.

groups:
- id: chinese-asr
  title: 中文 ASR 数据集
  description: 中文 ASR 训练 / 评测语料（朗读 / 工业 / 大规模 / 方言 / 中英混合）。
- id: english-multilingual-asr
  title: 英文 / 多语 ASR 数据集
  description: 英文与多语种 ASR 训练 / 评测语料（朗读 / 多语种 / 长音频 / 口音）。
- id: multi-speaker-noise-aug
  title: 多人 / 分离 / 噪声 / 增广
  description: 多人 ASR、说话人分离、噪声增广、RIR 增广所用的源 corpus。
- id: ser-sec
  title: SER / SEC (语音情感 / 事件)
  description: 语音情感识别与事件分类的训练 / 评测语料。
